#=====================================================
# PurpleWhale - Main Configuration
#=====================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 15000
max_z_velocity: 20
max_z_accel: 200
square_corner_velocity: 8.0

#=====================================================
# X Motor
#=====================================================

[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF4
position_endstop: 0
position_max: 160
homing_speed: 80

[tmc2209 stepper_x]
uart_pin: PC13
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

#=====================================================
# Y Motor
#=====================================================

[stepper_y]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF3
position_endstop: 0
position_max: 160
homing_speed: 80

[tmc2209 stepper_y]
uart_pin: PE4
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

#=====================================================
# Z0
#=====================================================

[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PB9
microsteps: 16
rotation_distance: 8

#=====================================================
# Z1
#=====================================================

[stepper_z1]
step_pin: PB5
dir_pin: PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 8

#=====================================================
# Z2
#=====================================================

[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG14
microsteps: 16
rotation_distance: 8

#=====================================================
# Z3
#=====================================================

[stepper_z3]
step_pin: PG10
dir_pin: PG9
enable_pin: !PG11
microsteps: 16
rotation_distance: 8

#=====================================================
# Quad Gantry Level
#=====================================================

[quad_gantry_level]
gantry_corners:
    -30,-30
    190,190

points:
    25,25
    135,25
    135,135
    25,135

speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01

#=====================================================
# Bed
#=====================================================

[heater_bed]
heater_pin: PA1
sensor_pin: PC5
sensor_type: Generic 3950
control: pid
min_temp: 0
max_temp: 120

#=====================================================
# SSR-Controlled AC Heater
#=====================================================
# SSR output connected to heater_pin above.

#=====================================================
# Fans
#=====================================================

[fan]
pin: PA8

#=====================================================
# Include Toolheads
#=====================================================

[include tool0.cfg]
[include tool1.cfg]
[include tool2.cfg]
[include tool3.cfg]

[include macros.cfg]
[include toolchanger.cfg]